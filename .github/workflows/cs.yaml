# yamllint disable rule:line-length
# yamllint disable rule:braces

name: Coding Standards

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  coding-standards:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        operating-system: [ ubuntu-latest ]
        php-version: [ 8.4 ]
        check:
          - makefile-target: 'composer-validate'
            name: 'Composer Validate & PSR-4 Check'
          - makefile-target: 'rector'
            name: 'Rector'
          - makefile-target: 'cs-lint'
            name: 'CS'
          - makefile-target: 'phpstan'
            name: 'PHPStan'

    name: ${{ matrix.check.name }} on PHP ${{ matrix.php-version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2

      - name: Install dependencies
        uses: ramsey/composer-install@4.0.0
        with:
          composer-options: --prefer-dist

      - name: Run ${{ matrix.check.makefile-target }}
        run: make ${{ matrix.check.makefile-target }}

  # This is a meta job to avoid to have to constantly change the protection rules
  # whenever we touch the matrix.
  tests-status:
    name: CS Status
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: coding-standards
    if: always()
    steps:
      - name: Successful run
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        run: exit 0

      - name: Failing run
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1
